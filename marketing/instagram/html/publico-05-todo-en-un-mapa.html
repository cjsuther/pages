:root {
  --fondo: #FFFFFF;
  --superficie: #F7F8F5;
  --borde: #E2E6DC;
  --texto: #111311;
  --apagado: #4A4F45;
  --acento: #6FBE44;
  --acento-suave: #3E7C1E;
  --sobre-acento: #14310A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1080px;
  height: 1350px;
  overflow: hidden;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--fondo);
  color: var(--texto);
  display: flex;
  flex-direction: column;
  padding: 84px 76px 68px;
  -webkit-font-smoothing: antialiased;
}

/* El acento entra por el borde de arriba: marca la casa antes de que se lea
   una sola palabra, y no le come lugar al contenido. */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 14px;
  background: var(--acento);
}

.etiqueta {
  align-self: flex-start;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 12px 24px;
  border-radius: 999px;
}

.etiqueta.artistas { background: var(--acento); color: var(--sobre-acento); }
.etiqueta.publico  { color: var(--acento-suave); border: 2px solid var(--acento); }

h1 {
  margin-top: 44px;
  font-size: 86px;
  font-weight: 900;
  line-height: 1.02;
  letter-spacing: -0.035em;
  text-wrap: balance;
}

h1 em { font-style: normal; color: var(--acento); }

/* En el mundo claro el verde de marca no contrasta bastante para texto
   grande sobre blanco, así que ahí se usa el verde oscuro. */
.publico h1 em { color: var(--acento-suave); }

.bajada {
  margin-top: 30px;
  font-size: 33px;
  font-weight: 400;
  line-height: 1.42;
  color: var(--apagado);
  /* Tres renglones largos y no cinco cortos: con la medida angosta quedaba
     media imagen vacía a la derecha mientras la pieza de abajo ocupaba todo
     el ancho, y eso se lee como un error de armado. */
  max-width: 19.5em;
}

/* El aire sobrante se reparte arriba y abajo de la pieza, en vez de juntarse
   todo en un solo hueco entre el texto y ella. Con `auto` de los dos lados,
   flexbox parte la diferencia. */
.pieza {
  margin-top: auto;
  margin-bottom: auto;
  padding-bottom: 46px;
}

.pie {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  border-top: 2px solid var(--borde);
  padding-top: 32px;
}

.pie img { height: 46px; }

.pie span {
  font-size: 27px;
  font-weight: 600;
  color: var(--apagado);
}


.mapa { position: relative; height: 430px; border-radius: 34px;
        background: var(--superficie); border: 2px solid var(--borde);
        overflow: hidden; }
/* Una trama de calles, sin mapa de verdad: lo que se reconoce es la forma.
   Las dos avenidas más gruesas son lo que la diferencia de una tabla. */
.mapa .calles { position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--borde) 2px, transparent 2px),
    linear-gradient(90deg, var(--borde) 2px, transparent 2px);
  background-size: 96px 96px; opacity: 0.85; }
.mapa .avenida { position: absolute; background: var(--borde); }
.mapa .avenida.h { left: 0; right: 0; height: 12px; }
.mapa .avenida.v { top: 0; bottom: 0; width: 12px; }
.mapa .rio { position: absolute; right: -60px; top: -40px; width: 300px;
             height: 620px; background: var(--acento); opacity: 0.10;
             transform: rotate(24deg); border-radius: 999px; }
.pin { position: absolute; width: 30px; height: 30px; border-radius: 999px;
       background: var(--acento); border: 5px solid var(--fondo); }
.pin.grande { width: 86px; height: 86px; display: flex; align-items: center;
              justify-content: center; font-size: 27px; font-weight: 900;
              color: var(--sobre-acento); }
.vos { position: absolute; width: 150px; height: 150px; border-radius: 999px;
       border: 3px dashed var(--acento); }

</style></head>
