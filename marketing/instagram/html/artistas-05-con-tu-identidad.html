:root {
  --fondo: #111311;
  --superficie: #1B1F1A;
  --borde: #2E342C;
  --texto: #FFFFFF;
  --apagado: #9AA394;
  --acento: #6FBE44;
  --acento-suave: #CDE6BB;
  --sobre-acento: #14310A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1080px;
  height: 1350px;
  overflow: hidden;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--fondo);
  color: var(--texto);
  display: flex;
  flex-direction: column;
  padding: 84px 76px 68px;
  -webkit-font-smoothing: antialiased;
}

/* El acento entra por el borde de arriba: marca la casa antes de que se lea
   una sola palabra, y no le come lugar al contenido. */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 14px;
  background: var(--acento);
}

.etiqueta {
  align-self: flex-start;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 12px 24px;
  border-radius: 999px;
}

.etiqueta.artistas { background: var(--acento); color: var(--sobre-acento); }
.etiqueta.publico  { color: var(--acento-suave); border: 2px solid var(--acento); }

h1 {
  margin-top: 44px;
  font-size: 86px;
  font-weight: 900;
  line-height: 1.02;
  letter-spacing: -0.035em;
  text-wrap: balance;
}

h1 em { font-style: normal; color: var(--acento); }

/* En el mundo claro el verde de marca no contrasta bastante para texto
   grande sobre blanco, así que ahí se usa el verde oscuro. */
.publico h1 em { color: var(--acento-suave); }

.bajada {
  margin-top: 30px;
  font-size: 33px;
  font-weight: 400;
  line-height: 1.42;
  color: var(--apagado);
  /* Tres renglones largos y no cinco cortos: con la medida angosta quedaba
     media imagen vacía a la derecha mientras la pieza de abajo ocupaba todo
     el ancho, y eso se lee como un error de armado. */
  max-width: 19.5em;
}

/* El aire sobrante se reparte arriba y abajo de la pieza, en vez de juntarse
   todo en un solo hueco entre el texto y ella. Con `auto` de los dos lados,
   flexbox parte la diferencia. */
.pieza {
  margin-top: auto;
  margin-bottom: auto;
  padding-bottom: 46px;
}

.pie {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  border-top: 2px solid var(--borde);
  padding-top: 32px;
}

.pie img { height: 46px; }

.pie span {
  font-size: 27px;
  font-weight: 600;
  color: var(--apagado);
}


.muestras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
.muestra { border-radius: 30px; overflow: hidden; border: 2px solid var(--borde);
           height: 300px; display: flex; flex-direction: column; }
.muestra .arriba { height: 44%; }
.muestra .abajo { flex: 1; padding: 22px; display: flex; flex-direction: column;
                  gap: 12px; justify-content: center; }
.muestra .abajo i { display: block; height: 13px; border-radius: 999px; }
.muestra .nombre { margin-top: 18px; text-align: center; font-size: 25px;
                   font-weight: 600; color: var(--apagado); }

</style></head>
